[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-diag"
version = "0.1.0"
description = "WiFi diagnostic agent for Raspberry Pi and Windows"
license = { file = "LICENSE" }
authors = [{ name = "Samuel Hurley" }]
requires-python = ">=3.9"
dependencies = [
    "speedtest-cli>=2.1.3",
    "zeroconf>=0.131.0",
]

[project.scripts]
wifi-diag = "wifi_diag.cli:main"

# Declared explicitly. Setuptools auto-discovery refuses to guess once the repo
# root holds more than one candidate directory, and `dispatcher/` (system
# scripts, not importable code) is exactly such a directory.
[tool.setuptools.packages.find]
include = ["wifi_diag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
